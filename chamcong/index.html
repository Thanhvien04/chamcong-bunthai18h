<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm Công - Bún Thái 18h</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }

        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url('bunthai-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            padding: 20px 15px; 
            color: #333; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%;
            max-width: 480px; 
            backdrop-filter: blur(5px);
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            text-align: center; 
            color: #d32f2f; 
            margin-bottom: 20px; 
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; color: #444; }

        select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 15px; 
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        select:focus, textarea:focus {
            border-color: #d32f2f;
            outline: none;
            box-shadow: 0 0 8px rgba(211, 47, 47, 0.2);
            background: #fff;
        }

        textarea { resize: vertical; height: 70px; }

        .shift-info { 
            font-size: 14px; 
            color: #2c3e50; 
            background: #eef2f5; 
            padding: 12px 15px; 
            border-radius: 8px; 
            margin-bottom: 18px; 
            text-align: center;
            border-left: 5px solid #d32f2f;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .btn-group { display: flex; gap: 12px; }

        .btn { 
            flex: 1; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-in { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
        .btn-out { background: linear-gradient(135deg, #c62828, #b71c1c); }

        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 6px 15px rgba(0,0,0,0.25); 
        }

        .btn:disabled {
            background: #cccccc !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .status-msg { 
            text-align: center; 
            margin-top: 15px; 
            font-weight: 600; 
            font-size: 14px; 
            animation: fadeIn 0.5s ease;
        }

        .stats-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .stats-title {
            font-size: 14px;
            font-weight: 700;
            color: #d32f2f;
            margin-bottom: 10px;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .stat-item {
            background: white;
            padding: 10px 5px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 800;
            margin-top: 4px;
        }

        .stat-val.work { color: #2e7d32; }
        .stat-val.late { color: #d32f2f; }
        .stat-val.ot { color: #1976d2; }

        .stat-lbl { font-size: 11px; color: #666; font-weight: 600; }

        .history-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
        }

        .history-title {
            font-size: 13px;
            font-weight: 700;
            color: #555;
            margin-bottom: 8px;
        }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            background: #fafafa;
            border-radius: 6px;
            padding: 8px 12px;
            border: 1px solid #eee;
        }

        .history-item {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .history-item:last-child { border-bottom: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="card">
        <h2>🍜 BÚN THÁI 18H 🍜</h2>

        <div class="form-group">
            <label for="staffName">Họ và tên nhân viên:</label>
            <select id="staffName" onchange="validateStaff()">
                <option value="">-- Chọn tên của bạn --</option>
                <option value="Minh Hiếu">Minh Hiếu</option>
                <option value="Đức Thịnh">Đức Thịnh</option>
                <option value="Thanh Viên">Thanh Viên</option>
            </select>
        </div>

        <div id="shiftDisplay" class="shift-info">Vui lòng chọn tên để xem ca làm việc</div>

        <div class="form-group">
            <label for="reason">Lý do (nếu đi trễ / về sớm):</label>
            <textarea id="reason" placeholder="Nhập lý do tại đây (ví dụ: Kẹt xe, có việc gia đình...)"></textarea>
        </div>

        <div class="btn-group">
            <button id="btnIn" class="btn btn-in" onclick="checkIn('Vào ca')">📍 VÀO CA</button>
            <button id="btnOut" class="btn btn-out" onclick="checkIn('Tan ca')">🚪 TAN CA</button>
        </div>

        <div id="status" class="status-msg"></div>

        <div class="stats-box" id="statsBox" style="display: none;">
            <div class="stats-title" id="statsTitle">📊 THỐNG KÊ THÁNG NÀY</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-lbl">Số Ngày Công</div>
                    <div class="stat-val work" id="userWorkDays">0 ca</div>
                </div>
                <div class="stat-item">
                    <div class="stat-lbl">Trễ / Về Sớm</div>
                    <div class="stat-val late" id="userLateMins">0 phút</div>
                </div>
                <div class="stat-item">
                    <div class="stat-lbl">Tăng Ca OT</div>
                    <div class="stat-val ot" id="userOtMins">0 phút</div>
                </div>
            </div>

            <div class="history-box">
                <div class="history-title">📋 Lịch sử bấm ca gần đây:</div>
                <div class="history-list" id="historyList">Chưa có dữ liệu.</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJ-DPekvwGgxoTWpg_vuY6Z-9H1EqJ2g4",
            authDomain: "chamcong-bunthai18h.firebaseapp.com",
            databaseURL: "https://chamcong-bunthai18h-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chamcong-bunthai18h",
            storageBucket: "chamcong-bunthai18h.firebasestorage.app",
            messagingSenderId: "854858207205",
            appId: "1:854858207205:web:22f26a84526f7130b8830c",
            measurementId: "G-YMVKFVD194"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const SHIFT_SCHEDULE = {
            "Minh Hiếu": { in: "18:30", out: "04:00" },
            "Đức Thịnh": { in: "10:00", out: "18:00" },
            "Thanh Viên": { in: "18:30", out: "24:00" }
        };

        window.onload = function() {
            const savedName = localStorage.getItem("registeredStaff");
            if (savedName) {
                const selectElement = document.getElementById("staffName");
                selectElement.value = savedName;
                selectElement.disabled = true;
                validateStaff();
            }
            checkDailyStatus();
        };

        function getTodayString() {
            const today = new Date();
            return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        }

        // KIỂM TRA VÀ KHÓA NÚT "VÀO CA" NẾU HÔM NAY ĐÃ BẤM
        function checkDailyStatus() {
            const todayStr = getTodayString();
            const lastCheckIn = localStorage.getItem("lastCheckInDate");

            if (lastCheckIn === todayStr) {
                const btnIn = document.getElementById("btnIn");
                btnIn.disabled = true;
                btnIn.innerText = "🔒 ĐÃ VÀO CA HÔM NAY";
            }
        }

        function parseMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function validateStaff() {
            const name = document.getElementById('staffName').value;
            const statusDiv = document.getElementById('status');
            const shiftDisplay = document.getElementById('shiftDisplay');
            const statsBox = document.getElementById('statsBox');

            if (!name) {
                statusDiv.innerText = '';
                shiftDisplay.innerText = 'Vui lòng chọn tên để xem ca làm việc';
                statsBox.style.display = 'none';
                return;
            }

            const schedule = SHIFT_SCHEDULE[name];
            const displayOut = schedule.out === "24:00" ? "00:00" : schedule.out;
            shiftDisplay.innerHTML = `⏰ Ca làm quy định: <b>${schedule.in} - ${displayOut}</b>`;
            statusDiv.innerText = '';
            statsBox.style.display = 'block';

            loadUserStats(name);
        }

        function loadUserStats(name) {
            const now = new Date();
            const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('statsTitle').innerText = `📊 BẢNG CÔNG THÁNG ${now.getMonth() + 1}/${now.getFullYear()} (${name})`;

            database.ref('attendance').orderByChild('name').equalTo(name).on('value', (snapshot) => {
                const data = snapshot.val();
                let workDays = 0, lateMins = 0, otMins = 0;
                let historyItems = [];

                if (data) {
                    const keys = Object.keys(data);
                    
                    keys.forEach(key => {
                        const item = data[key];
                        const itemDate = new Date(item.timestamp);
                        const itemMonth = `${itemDate.getFullYear()}-${String(itemDate.getMonth() + 1).padStart(2, '0')}`;

                        if (itemMonth === currentMonth) {
                            const isRejectedOrPending = (item.approvalStatus === 'Từ chối' || item.approvalStatus === 'Chờ duyệt');
                            const isApproved = (item.approvalStatus === 'Đã duyệt' || !item.approvalStatus);

                            if (item.type === 'Vào ca') {
                                workDays += 1;
                                if (item.lateMinutes > 0 && isRejectedOrPending) {
                                    lateMins += item.lateMinutes;
                                }
                            } else if (item.type === 'Tan ca') {
                                if (item.earlyMinutes > 0 && isRejectedOrPending) {
                                    lateMins += item.earlyMinutes;
                                }
                                if (item.otMinutes > 0 && isApproved) {
                                    otMins += item.otMinutes;
                                }
                            }
                        }
                    });

                    keys.reverse().slice(0, 10).forEach(key => {
                        const item = data[key];
                        historyItems.push(`
                            <div class="history-item">
                                <span><b>${item.type}</b> lúc ${item.time}</span>
                                <span style="color:${item.approvalStatus === 'Chờ duyệt' ? '#e67e22' : '#2e7d32'}">${item.approvalStatus || 'Đã duyệt'}</span>
                            </div>
                        `);
                    });
                }

                document.getElementById('userWorkDays').innerText = `${workDays} ca`;
                document.getElementById('userLateMins').innerText = `${lateMins} phút`;
                document.getElementById('userOtMins').innerText = `${otMins} phút`;
                document.getElementById('historyList').innerHTML = historyItems.length > 0 ? historyItems.join('') : 'Chưa có lượt bấm ca nào.';
            });
        }

        function checkIn(type) {
            const name = document.getElementById('staffName').value;
            const reason = document.getElementById('reason').value.trim();
            const statusDiv = document.getElementById('status');
            const todayStr = getTodayString();

            if (!name) {
                alert('Vui lòng chọn tên nhân viên!');
                return;
            }

            // 1. RÀNG BUỘC TÊN THEO MÁY
            const registeredStaff = localStorage.getItem("registeredStaff");
            if (registeredStaff && registeredStaff !== name) {
                alert(`⚠️ Máy này đã được khóa cho nhân viên "${registeredStaff}". Không thể chấm công hộ người khác!`);
                return;
            }

            // 2. RÀNG BUỘC 1 LẦN VÀO CA / NGÀY / MÁY
            if (type === 'Vào ca') {
                const lastCheckIn = localStorage.getItem("lastCheckInDate");
                if (lastCheckIn === todayStr) {
                    alert('⚠️ Thiết bị này đã bấm Vào ca hôm nay rồi! Không thể bấm thêm lần nữa.');
                    return;
                }
            }

            const now = new Date();
            const timeString = now.toLocaleString('vi-VN');
            const schedule = SHIFT_SCHEDULE[name];

            const currentMins = now.getHours() * 60 + now.getMinutes();
            let inMins = parseMinutes(schedule.in);
            let outMins = parseMinutes(schedule.out);

            if (outMins <= inMins) outMins += 24 * 60;

            let lateMinutes = 0, earlyInMinutes = 0, earlyMinutes = 0, otMinutes = 0;

            if (type === 'Vào ca') {
                let actualIn = currentMins;
                if (outMins > 24 * 60 && currentMins < 8 * 60) actualIn += 24 * 60;

                if (actualIn > inMins) lateMinutes = actualIn - inMins;
                else earlyInMinutes = inMins - actualIn;
            } else if (type === 'Tan ca') {
                let actualOut = currentMins;
                if (outMins > 24 * 60 && currentMins < 10 * 60) actualOut += 24 * 60;

                if (actualOut < outMins) earlyMinutes = outMins - actualOut;
                else otMinutes = actualOut - outMins;
            }

            if ((lateMinutes > 0 || earlyMinutes > 0) && !reason) {
                if (!confirm('Bạn đi trễ / về sớm nhưng chưa nhập lý do. Bạn có muốn gửi luôn không?')) {
                    document.getElementById('reason').focus();
                    return;
                }
            }

            let approvalStatus = (lateMinutes > 0 || earlyMinutes > 0) ? 'Chờ duyệt' : 'Đã duyệt';

            database.ref('attendance').push({
                name: name,
                type: type,
                time: timeString,
                lateMinutes: lateMinutes,
                earlyInMinutes: earlyInMinutes,
                earlyMinutes: earlyMinutes,
                otMinutes: otMinutes,
                reason: reason || 'Không có',
                approvalStatus: approvalStatus,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                // LƯU KHÓA TÊN VÀ KHÓA LẦN CHẤM TRONG NGÀY
                if (!registeredStaff) {
                    localStorage.setItem("registeredStaff", name);
                    document.getElementById("staffName").disabled = true;
                }

                if (type === 'Vào ca') {
                    localStorage.setItem("lastCheckInDate", todayStr);
                    checkDailyStatus();
                }

                let note = '';
                if (type === 'Vào ca') {
                    if (lateMinutes > 0) note = `<br><span style="color:#d32f2f;">(Trễ ${lateMinutes} phút - ${approvalStatus})</span>`;
                    else if (earlyInMinutes > 0) note = `<br><span style="color:#2e7d32;">(Đến sớm ${earlyInMinutes} phút)</span>`;
                    else note = '<br><span style="color:#2e7d32;">(Đúng giờ vào ca)</span>';
                } else if (type === 'Tan ca') {
                    if (earlyMinutes > 0) note = `<br><span style="color:#e67e22;">(Về sớm ${earlyMinutes} phút - ${approvalStatus})</span>`;
                    else if (otMinutes > 0) note = `<br><span style="color:#1976d2;">(Tăng ca ${otMinutes} phút)</span>`;
                    else note = '<br><span style="color:#2e7d32;">(Đúng giờ tan ca)</span>';
                }

                statusDiv.innerHTML = `✅ <b>${name}</b> đã ${type} lúc ${timeString}${note}`;
                document.getElementById('reason').value = '';
            }).catch((error) => {
                alert('Lỗi: ' + error.message);
            });
        }
    </script>
</body>
</html>
